<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" role="img" aria-label="A replicate's kernel applications as cells along time t, from 0 to m = 24, for a pair with lag L = 3 that meets at tau = 10. Chain X, magenta, takes the first 3 steps alone; from L to tau both chains step, X in magenta above and Y, teal, below, 7 coupled steps counted twice; from tau to m the met chain, dark, steps alone, 14 more. Under each part, its number of steps and the applications of each step: 1, 2 and 1. Text: C = L + 2(tau - L) + max(0, m - tau) = 3 + 2 x 7 + 14 = 31 kernel applications." font-family="'Red Hat Text', system-ui, sans-serif" font-size="19" fill="#062A4F"><rect width="640" height="308" fill="#FBFAF7"/><text x="20" y="30" text-anchor="start"><tspan font-style="italic">C</tspan> = <tspan font-style="italic">L</tspan> + 2(<tspan font-style="italic">τ</tspan> − <tspan font-style="italic">L</tspan>) + max(0, <tspan font-style="italic">m</tspan> − <tspan font-style="italic">τ</tspan>)</text><text x="20" y="56" text-anchor="start" fill="#55657A">= 3 + 2 × 7 + 14 = 31 kernel applications</text><text x="50" y="131" text-anchor="end" fill="#D93A74"><tspan font-style="italic">X</tspan></text><text x="50" y="165" text-anchor="end" fill="#0095A6"><tspan font-style="italic">Y</tspan></text><rect x="71.5" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="94" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="116.5" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="139" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="161.5" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="184" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="206.5" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="229" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="251.5" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="274" y="112" width="19.5" height="26" fill="#D93A74"/><rect x="139" y="146" width="19.5" height="26" fill="#0095