<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462" role="img" aria-label="Two chains of HMC on a standard normal target in two dimensions, whose contours at 1 and 2 are drawn in gray. Chain X, magenta, starts at (-2.2, 1.6) and chain Y, teal, at (1.8, -0.6). Each takes 3 leapfrog trajectories of 5 steps with the same momentum; the distance between them falls from 4.57, 2.46, 1.33, 0.71 and never reaches 0. Then a meeting step, a random-walk step of scale sigma = 0.5 drawn as a dashed circle around each chain, coupled by the reflection-maximal coupling, moves both to one point, (-0.20, 0.30), inside both circles, drawn as a dark ring labeled X = Y. At the distance 0.71, the two proposals of a meeting step coincide with probability 0.47." font-family="'Red Hat Text', system-ui, sans-serif" font-size="19" fill="#062A4F"><rect width="640" height="462" fill="#FBFAF7"/><circle cx="300" cy="264" r="92" fill="none" stroke="#D9D5CB" stroke-width="1.5"/><circle cx="300" cy="264" r="184" fill="none" stroke="#D9D5CB" stroke-width="1.5"/><text x="432.5" y="125.5" text-anchor="start" fill="#55657A"><tspan font-style="italic">π</tspan></text><path d="M97.6 116.8 L104 122.2 L118.2 133.2 L139.6 149.5 L167.5 170.4 L200.7 195" fill="none" stroke="#D93A74" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="104" cy="122.2" r="2.5" fill="#D93A74"/><circle cx="118.2" cy="133.2" r="2.5" fill="#D93A74"/><circle cx="139.6" cy="149.5" r="2.5" fill="#D93A74"/><circle cx="167.5" cy="170.4" r="2.5" fill="#D93A74"/><circle cx="200.7" cy="195" r="4.5" fill="#D93A74"/><circle cx="97.6" cy="116.8" r="4.5" fill="#D93A74"/><path d="M200.7 195 L214.5 194.4 L231.7 196.6 L251.6 201.6 L273.5 209 L296.4 218.6" fill="none" stroke="#D93A74" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="214.5" cy="194.4" r="2.5" fill="#D93A74"/><circle cx="231.7" cy="196.6" r="2.5" fill="#D93A74"/><circle cx="251.6" cy="201.6" r="2.5" fill="#D93A74"/><cir