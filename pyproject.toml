[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telescopic"
dynamic = ["version"]
description = "Unbiased Markov chain Monte Carlo with coupled chains and telescoping sums"
readme = "README.md"
requires-python = ">=3.11"
# The oldest stack that CI tests.
dependencies = ["numpy>=1.26", "scipy>=1.12", "threadpoolctl>=3.1"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua S. Speagle" }]
keywords = ["MCMC", "unbiased estimation", "couplings", "Bayesian inference", "astronomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
progress = ["tqdm>=4.66"]
pandas = ["pandas>=2.1"]
all = ["telescopic[plot,progress,pandas]"]

[project.urls]
Repository = "https://github.com/joshspeagle/telescopic"
Changelog = "https://github.com/joshspeagle/telescopic/blob/main/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]
dev = [
    { include-group = "test" },
    "ruff==0.17.2",
    "mypy==2.4.0",
    # scipy ships no type information; scipy-stubs 1.18 needs Python 3.12.
    "scipy-stubs==1.18.1.1; python_version >= '3.12'",
    "pre-commit",
    "matplotlib>=3.8",
]
docs = [
    "sphinx==9.2.0",
    "myst-nb==1.4.0",
    "furo==2025.12.19",
    "sphinx-copybutton==0.5.2",
    "numpydoc==1.11.0",
    "sphinxcontrib-bibtex==2.7.0",
    "matplotlib>=3.8",
    "ipykernel",
]

[tool.hatch.version]
path = "src/telescopic/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/CITATION.cff", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-markers -m "not slow"'
markers = [
    "slow: needs many replicates for its tolerance or takes more than 5 s; run with -m slow",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["telescopic"]

[tool.coverage.report]
fail_under = 90
# Without decimals, a total of 89.5% would round up and pass.
precision = 2

[tool.mypy]
strict = true
# scipy-stubs needs Python 3.12; the commands also run mypy --python-version 3.11.
python_version = "3.12"
files = ["src/telescopic"]

[tool.ruff]
line-length = 99
extend-exclude = ["research_notes", "notes/reviews/scripts", "*.md"]

[tool.ruff.lint]
# No pep8-naming rules: the code follows the spec's notation (H, R, L), as CLAUDE.md allows.
extend-select = ["B", "C4", "I", "NPY", "PT", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
# The tests' helper module of reference implementations.
known-first-party = ["references"]
