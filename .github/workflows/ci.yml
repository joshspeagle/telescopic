name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run on main is never canceled, so that the slow job reports on every merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # One job checks the coverage floor.
          - { os: ubuntu-latest, python-version: "3.13", cov: "--cov" }
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.15" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # --group needs pip 25.1.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-compile . --group test
      - run: python -m pytest -q -ra ${{ matrix.cov }}

  oldest:
    name: test (oldest stack, py3.11, numpy 1.26, scipy 1.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-compile . --group test "numpy==1.26.*" "scipy==1.12.*"
      - run: python -m pytest -q -ra

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . --group dev
      - run: ruff check .
      - run: ruff format --check .
      # The tracked files, as the pre-commit hook passes them.
      - run: git ls-files -z | xargs -0 codespell
      - run: mypy

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . --group docs
      # The identity's files and the landing page's coupled pair match their sources.
      - run: python docs/_scripts/brand.py --check
      - run: python docs/_scripts/hero_pair.py --check
      # The doctrees go beside the site, not into it, so that they are not published.
      - name: Build, with warnings as errors, executing the tutorials
        run: sphinx-build -W --keep-going -d docs/_build/doctrees docs docs/_build/html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    # Publishes the site that the docs job built.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    # The group of Pages deployments: a running one is never canceled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  dist:
    # Builds the wheel and the sdist and imports the wheel in a clean environment.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      # -I keeps the working directory off the import path.
      - run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -I -c "import telescopic; print(telescopic.__version__)"

  slow:
    # Runs on every push to main and when started by hand, never on pull requests.
    # -m "" lifts the -m "not slow" of pyproject.toml.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-compile . --group test
      - run: python -m pytest -q -ra -m ""
